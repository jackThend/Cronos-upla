<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronos UPLA - Lienzo Temporal</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .event-group.activo .event-ribbon { outline: 2px solid #fff; }
        .barra-lienzo { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 0.5rem 2rem; color: #fff; font-size: 0.9rem; }
        .barra-lienzo label { display: flex; align-items: center; gap: 6px; }
        .barra-lienzo input[type="number"], .barra-lienzo input[type="text"], .barra-lienzo select { background: rgba(0,0,0,0.4); color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; padding: 4px 8px; }
        .barra-lienzo input[type="number"] { width: 90px; }
        .barra-lienzo .btn { width: auto; padding: 5px 12px; font-size: 0.85rem; }
        .filtros-categorias { display: flex; gap: 10px; flex-wrap: wrap; }
        .resultados-busqueda { position: absolute; top: 100%; left: 0; background: rgba(10,15,30,0.95); border-radius: 6px; min-width: 260px; max-height: 260px; overflow-y: auto; z-index: 10; }
        .resultados-busqueda div { padding: 6px 10px; cursor: pointer; }
        .resultados-busqueda div:hover { background: rgba(255,255,255,0.1); }
        .overlay-panel { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 50; }
        .overlay-panel.hidden { display: none; }
        .overlay-contenido { background: rgba(10,15,30,0.95); color: #fff; border-radius: 16px; padding: 1.5rem; max-width: 720px; width: 90%; max-height: 85vh; overflow-y: auto; }
        .overlay-contenido table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
        .overlay-contenido th, .overlay-contenido td { border-bottom: 1px solid rgba(255,255,255,0.15); padding: 6px; text-align: left; font-size: 0.9rem; }
        .leyenda-relaciones { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8rem; color: rgba(255,255,255,0.8); }
        .leyenda-relaciones span::before { content: '■ '; }
    </style>
</head>
<body class="dashboard-body">
    
    <div style="position: relative; z-index: 2; height: 100vh; display: flex; flex-direction: column; overflow: hidden;">
        <nav class="top-nav glass-panel" style="padding: 0.8rem 2rem;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <a href="explorador.html" style="color: #fff; text-decoration: none; font-size: 1.8rem; font-weight: bold; text-shadow: 0 0 10px rgba(255,255,255,0.5); transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">←</a>
                <h1 id="lienzoEscenaTitulo" class="nav-title" style="margin:0; font-size: 1.6rem; text-shadow: 0 2px 10px rgba(0,0,0,0.8);">Cargando Escena...</h1>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                <button type="button" class="btn" style="width: auto; padding: 6px 12px;" onclick="window.exportarLienzoPNG()">PNG</button>
                <button type="button" class="btn" style="width: auto; padding: 6px 12px;" onclick="window.exportarLienzoPDF()">PDF</button>
                <button type="button" class="btn" style="width: auto; padding: 6px 12px;" onclick="window.exportarFicha()">Ficha</button>
                <button type="button" class="btn" style="width: auto; padding: 6px 12px;" onclick="window.abrirPresentacion()">Presentar</button>
                <button type="button" class="btn" style="width: auto; padding: 6px 12px;" onclick="window.abrirAnalisis()">Análisis</button>
                <button type="button" class="btn" style="width: auto; padding: 6px 12px;" onclick="window.abrirPreguntas()">Preguntas</button>
                <img src="assets/img/escultura.png" alt="Logo" style="height: 35px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.4)); margin-left: 6px;">
            </div>
        </nav>

        <div class="barra-lienzo">
            <label>Escala
                <select id="modoEscala">
                    <option value="lineal">Lineal</option>
                    <option value="larga">Larga duración</option>
                </select>
            </label>
            <label><input type="checkbox" id="relativoCheck"> Alinear líneas a su inicio</label>
            <label>Periodo
                <input type="number" id="periodoDesde" placeholder="Desde">
                <input type="number" id="periodoHasta" placeholder="Hasta">
            </label>
            <button type="button" class="btn" id="btnAplicarPeriodo">Aplicar</button>
            <button type="button" class="btn" id="btnQuitarPeriodo" style="background: #95a5a6;">Quitar</button>
            <div style="position: relative;">
                <input type="text" id="buscadorEvento" placeholder="Buscar evento..." autocomplete="off">
                <div id="resultadosBusqueda" class="resultados-busqueda hidden"></div>
            </div>
            <div class="filtros-categorias" id="filtrosCategorias"></div>
            <div class="leyenda-relaciones" id="leyendaRelaciones"></div>
        </div>

        <div class="canvas-scroll-area" id="canvasScrollArea" style="flex: 1;">
            <div class="timeline-global-container" id="timelineGlobalContainer">
                <div style="display:flex; justify-content:center; align-items:center; height:100vh;">
                    <h2 style="color: rgba(255,255,255,0.7); text-shadow: 0 2px 5px rgba(0,0,0,0.8); font-weight: 300;">Preparando el viaje en el tiempo...</h2>
                </div>
            </div>
        </div>

    <!-- Controles de Zoom Flotantes -->
    <div class="zoom-controls">
        <button id="btnZoomIn" class="zoom-btn" title="Acercar (Zoom In)">+</button>
        <span id="zoomLabel" class="zoom-label">4 px/año</span>
        <button id="btnZoomOut" class="zoom-btn" title="Alejar (Zoom Out)">−</button>
    </div>

    <!-- Modal de Evento (Oculto por defecto) -->
    <div id="eventModalOverlay" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <button id="btnCloseModal" class="modal-close">&times;</button>
            <div id="modalImageContainer" class="modal-image-container"></div>
            <div class="modal-body">
                <span id="modalCategory" class="event-category" style="position: relative; display: inline-block; top: 0; right: 0; margin-bottom: 10px;"></span>
                <h2 id="modalTitle" style="color: white; margin-bottom: 5px;"></h2>
                <h3 id="modalYears" style="color: #f39c12; margin-bottom: 15px;"></h3>
                <p id="modalDesc" style="color: rgba(255,255,255,0.8); line-height: 1.6;"></p>
                <p id="modalFuente" style="margin-top: 15px;"></p>
                <div id="modalExtra" style="color: rgba(255,255,255,0.85); margin-top: 15px; line-height: 1.5;"></div>
            </div>
        </div>
    </div>

    <!-- Panel de analisis -->
    <div id="panelAnalisis" class="overlay-panel hidden">
        <div class="overlay-contenido">
            <button type="button" class="btn" style="width: auto; float: right; background: #95a5a6;" onclick="document.getElementById('panelAnalisis').classList.add('hidden')">Cerrar</button>
            <h3>Análisis de la escena</h3>
            <div id="contenidoAnalisis"></div>
        </div>
    </div>

    <!-- Panel de presentacion -->
    <div id="panelPresentacion" class="overlay-panel hidden">
        <div class="overlay-contenido">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span id="presentacionContador" style="color: rgba(255,255,255,0.6);"></span>
                <button type="button" class="btn" style="width: auto; background: #95a5a6;" onclick="window.cerrarPresentacion()">Salir</button>
            </div>
            <h2 id="presentacionTitulo" style="margin-top: 1rem;"></h2>
            <h3 id="presentacionFecha" style="color: #f39c12;"></h3>
            <p id="presentacionDesc" style="line-height: 1.6; margin-top: 1rem;"></p>
            <p id="presentacionInterpretacion" style="color: rgba(255,255,255,0.75); font-style: italic; margin-top: 0.5rem;"></p>
            <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
                <button type="button" class="btn" style="flex: 1;" onclick="window.pasoPresentacion(-1)">← Anterior</button>
                <button type="button" class="btn" style="flex: 1;" onclick="window.pasoPresentacion(1)">Siguiente →</button>
            </div>
        </div>
    </div>

    <!-- Panel de preguntas guiadas -->
    <div id="panelPreguntas" class="overlay-panel hidden">
        <div class="overlay-contenido">
            <button type="button" class="btn" style="width: auto; float: right; background: #95a5a6;" onclick="document.getElementById('panelPreguntas').classList.add('hidden')">Cerrar</button>
            <h3>Preguntas guiadas</h3>
            <ol id="listaPreguntas" style="line-height: 1.7; margin-top: 1rem;"></ol>
        </div>
    </div>

    <!-- Notificaciones Toast -->
    <div id="toastContainer" class="toast-container"></div>
    </div> <!-- Cierre del wrapper z-index: 2 -->

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="app.js"></script>
    <script src="analisis.js"></script>
    <script src="lienzo.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cadenaUsuario = localStorage.getItem('usuario_cronos');
            if(!cadenaUsuario) {
                window.location.href = 'index.html';
                return;
            }
            // Inicio parametros url
            const parametrosUrl = new URLSearchParams(window.location.search);
            const idEscena = parametrosUrl.get('id');
            
            if(!idEscena) {
                window.location.href = 'explorador.html';
                return;
            }

            if(window.cargarLienzo) {
                window.cargarLienzo(idEscena);
            }
        });
    </script>
</body>
</html>
